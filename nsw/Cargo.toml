[package]
name = "nsw"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
csv = "1.3"
anyhow = "1.0"
stv = { path = "../stv" }
zip = "4.0"
serde = {version="1.0", features = ["derive"]}
serde_json = "1.0"
scraper = "0.23"
rand = "0.9"
rand_chacha = "0.9"
calamine = "0.26.1" # Calamine 0.27 depends on Zip 2.5 which is yanked.
url = "2.5"
regex = "1.11"